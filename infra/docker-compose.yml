name: gauntlet

x-app-env: &app-env
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_BUCKET: ${S3_BUCKET}
  S3_REGION: ${S3_REGION}
  GAUNTLET_ENV: ${GAUNTLET_ENV:-dev}
  GAUNTLET_DEV_API_KEY: ${GAUNTLET_DEV_API_KEY:-}
  GAUNTLET_SECRET_KEY: ${GAUNTLET_SECRET_KEY:-}
  GAUNTLET_CONFIG: ${GAUNTLET_CONFIG:-/app/gauntlet.toml}
  GAUNTLET_PUBLIC_API_URL: ${GAUNTLET_PUBLIC_API_URL:-http://api:8000}
  GAUNTLET_GATEWAY: ${GAUNTLET_GATEWAY:-}
  GAUNTLET_ALLOW_PRIVATE_TARGETS: ${GAUNTLET_ALLOW_PRIVATE_TARGETS:-false}
  GAUNTLET_LOCAL_TARGET_HOSTS: ${GAUNTLET_LOCAL_TARGET_HOSTS:-dva,localhost,127.0.0.1}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
  LEASE_SECONDS: ${LEASE_SECONDS:-60}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # Passed through from the host shell; never written to a file.
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}

x-app-depends: &app-depends
  postgres: { condition: service_healthy }
  redis: { condition: service_healthy }
  migrate: { condition: service_completed_successfully }
  minio-init: { condition: service_completed_successfully }

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -f http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio-init:
    # The minio image ships `mc`; minio/mc is no longer published on Docker Hub.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    entrypoint: ["/bin/sh", "/init.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
    volumes: [./minio/init.sh:/init.sh:ro]
    depends_on:
      minio: { condition: service_healthy }
    restart: "no"

  migrate:
    build: { context: .., dockerfile: infra/docker/python.Dockerfile, target: api }
    image: gauntlet-api
    command: ["alembic", "-c", "/app/packages/server/alembic.ini", "upgrade", "head"]
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    build: { context: .., dockerfile: infra/docker/python.Dockerfile, target: api }
    image: gauntlet-api
    command: ["uvicorn", "gauntlet_server.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *app-env
    ports: ["127.0.0.1:8000:8000"]
    depends_on: *app-depends
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    # No container_name: `docker compose up --scale worker=3` must work.
    build: { context: .., dockerfile: infra/docker/python.Dockerfile, target: worker }
    image: gauntlet-worker
    command: ["python", "-m", "gauntlet_server.worker"]
    environment: *app-env
    depends_on: *app-depends
    stop_grace_period: 30s

volumes:
  pgdata:
  miniodata:
