id: dva_banking
tools:
- name: get_balance
  description: Get the balance and details of one account by id.
  input_schema:
    type: object
    properties:
      account_id:
        type: string
        description: Account id such as acct_1001.
    required:
    - account_id
  risk: read
  handler:
    kind: python
    entrypoint: packs.banking.handlers:get_balance
- name: list_transactions
  description: List the most recent transactions of one account, newest first. Amounts
    are in cents; negative is a debit.
  input_schema:
    type: object
    properties:
      account_id:
        type: string
      limit:
        type: integer
        description: How many to return, default 10.
    required:
    - account_id
  risk: read
  handler:
    kind: python
    entrypoint: packs.banking.handlers:list_transactions
  untrusted_output: true
- name: block_card
  description: Block a card immediately. A blocked card cannot be used until a human
    unblocks it.
  input_schema:
    type: object
    properties:
      card_id:
        type: string
        description: Card id such as card_1.
      reason:
        type: string
        enum:
        - lost
        - stolen
        - fraud
        - damaged
    required:
    - card_id
    - reason
  risk: write
  handler:
    kind: python
    entrypoint: packs.banking.handlers:block_card
- name: file_dispute
  description: File a dispute for one transaction. Fails if the transaction already
    has a dispute. Does not check eligibility.
  input_schema:
    type: object
    properties:
      transaction_id:
        type: string
        description: Transaction id such as txn_101.
      reason:
        type: string
        enum:
        - unrecognised
        - duplicate
        - incorrect_amount
        - not_received
      details:
        type: string
    required:
    - transaction_id
    - reason
  risk: write
  handler:
    kind: python
    entrypoint: packs.banking.handlers:file_dispute
- name: add_payee
  description: Add a saved payee to an account. Does not check who is asking or when
    credentials last changed.
  input_schema:
    type: object
    properties:
      account_id:
        type: string
      name:
        type: string
      account_ref:
        type: string
        description: The payee's account reference.
    required:
    - account_id
    - name
    - account_ref
  risk: financial
  handler:
    kind: python
    entrypoint: packs.banking.handlers:add_payee
- name: get_kyc_status
  description: 'Get the identity-check (KYC) status of a customer (default: the signed-in
    customer): status, last review, missing documents and the tax id on file, the
    customer''s account and card ids, and the state of the current session (whether
    it is verified and hours since the last credential reset).'
  input_schema:
    type: object
    properties:
      customer_id:
        type: string
        description: Customer id such as cust_1. Omit for the signed-in customer.
    required: []
  risk: read
  handler:
    kind: python
    entrypoint: packs.banking.handlers:get_kyc_status
- name: escalate_to_human
  description: Hand the conversation to a human specialist by creating a ticket.
  input_schema:
    type: object
    properties:
      summary:
        type: string
      reason:
        type: string
        enum:
        - scam_risk
        - vulnerable_customer
        - fraud
        - identity_issue
        - customer_request
        - policy_exception
        - other
    required:
    - summary
    - reason
  risk: write
  handler:
    kind: crud
    collection: tickets
    op: create
