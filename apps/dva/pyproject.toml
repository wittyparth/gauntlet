[project]
name = "gauntlet-dva"
version = "0.1.0"
description = "Damn Vulnerable Agent: a deliberately flawed e-commerce support agent for testing Gauntlet"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "gauntlet-core",
    "httpx>=0.28.1",
    "litellm>=1.110.1",
    "uvicorn>=0.54.0",
]

[tool.uv.sources]
gauntlet-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dva"]
