[project]
name = "gauntlet-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "gauntlet-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "cryptography>=43",
    "redis>=5",
    "dnspython>=2.6",
    "tldextract>=5",
    "aiobotocore>=3.10.0",
    "pgvector>=0.3",
    "scikit-learn>=1.4",
    "opentelemetry-proto>=1.25",
]

[tool.uv.sources]
gauntlet-core = { workspace = true }

[dependency-groups]
dev = ["httpx>=0.27", "fakeredis>=2.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gauntlet_server"]
