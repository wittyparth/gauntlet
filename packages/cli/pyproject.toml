[project]
name = "gauntlet-cli"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["gauntlet-core"]

[tool.uv.sources]
gauntlet-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gauntlet_cli"]
