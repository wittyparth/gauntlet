[project]
name = "gauntlet-core"
version = "0.1.0"
description = "Gauntlet engine: simulate, record, evaluate and attack AI agents in a mock world"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "pyyaml>=6",
    "aiosqlite>=0.20",
    "litellm>=1.50",
    "httpx>=0.27",
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
cluster = ["scikit-learn>=1.4"]
mcp = ["mcp>=2.0"]
classifier = ["onnxruntime>=1.17", "tokenizers>=0.19", "numpy>=1.26"]
classifier-torch = ["transformers>=4.40", "torch>=2.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gauntlet_core"]

[dependency-groups]
dev = [
    "respx>=0.23.1",
]
