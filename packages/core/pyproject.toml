[project]
name = "gauntlet-core"
version = "0.1.0"
description = "Gauntlet engine: simulate, record, evaluate and attack AI agents in a mock world"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8", "pyyaml>=6", "aiosqlite>=0.20"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gauntlet_core"]
