[project]
name = "gauntlet-mcp"
version = "0.1.0"
description = "MCP server so coding agents can drive a Gauntlet platform (read tools plus a capped, confirmed create_run)."
requires-python = ">=3.12"
dependencies = ["httpx>=0.28.1", "mcp>=1.0"]

[project.scripts]
gauntlet-mcp = "gauntlet_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gauntlet_mcp"]
