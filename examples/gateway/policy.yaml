id: refund-policy
version: 1
mode: shadow            # the script overrides this per run
fail: open
rules:
  - id: refund-cap
    description: Refunds over 10000 cents are not allowed
    severity: critical
    action: block
    message: Refunds over 10000 cents need a human; escalate instead.
    when:
      type: tool_called
      tool: issue_refund
      args:
        amount_cents: {gt: 10000}
