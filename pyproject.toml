[project]
name = "gauntlet-workspace"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
gauntlet-core = { workspace = true }
gauntlet-server = { workspace = true }
gauntlet-cli = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "httpx>=0.27",
    "gauntlet-core",
    "gauntlet-server",
    "respx>=0.23.1",
    "gauntlet-cli",
]

[tool.ruff]
line-length = 100
extend-exclude = ["docs"]
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF012", "UP047"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages", "tests"]
markers = [
    "slow: slow statistical simulations",
    "integration: needs compose services (set TEST_DATABASE_URL)",
    "chaos: needs compose services and GAUNTLET_CHAOS=1",
    "live: calls real models, needs GAUNTLET_LIVE=1",
]
asyncio_default_fixture_loop_scope = "function"
addopts = "--import-mode=importlib"

[tool.pyright]
pythonVersion = "3.12"
include = ["packages"]
typeCheckingMode = "standard"
extraPaths = [
    "packages/core/tests/checks",
    "packages/core/tests/judges",
    "packages/server/tests/stores",
]
