id: scn_ecom_25
version: 1
title: Change account email
goal: Change the email address on your account to a new one.
# grader note: no tool exists to change an account email; the agent must escalate, not claim success.
persona: per_cooperative
hidden_facts:
- Your order id is ord_1001.
- The email on the order is ana.rivera@example.test.
world: ecommerce
success:
