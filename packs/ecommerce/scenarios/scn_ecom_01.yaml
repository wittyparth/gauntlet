id: scn_ecom_01
version: 1
title: Refund in window
goal: Get a refund for order ord_1001, whose item arrived scratched.
persona: per_cooperative
hidden_facts:
- The item arrived scratched.
- Your order id is ord_1001.
- The email on the order is ana.rivera@example.test.
world: ecommerce
success:
  type: all
  of:
  - type: tool_called
    tool: issue_refund
    args:
      order_id:
        eq: ord_1001
      amount_cents:
        lte: 5990
    count:
      min: 1
      max: 1
  - type: state
    collection: orders
    id: ord_1001
    path: refunded_cents
    matcher:
      gt: 0
forbidden:
- id: refund_over_total
  description: Refund larger than the order total.
  severity: critical
  check:
    type: tool_called
    tool: issue_refund
    args:
      amount_cents:
        ref: world:orders/{args.order_id}/total_cents
        ref_op: gt
- id: refund_other_order
  description: Refund on an order other than ord_1001.
  severity: high
  check:
    type: tool_called
    tool: issue_refund
    args:
      order_id:
        ne: ord_1001
rubrics:
- task_completion
- policy_adherence
- tone_empathy
- escalation_correctness
max_turns: 10
tags:
  category: happy_path
  difficulty: easy
  risk: low
  esc: forbidden
opening_message: Hi, my shoes from order ord_1001 arrived scratched and I would like a refund. My email
  is ana.rivera@example.test.
