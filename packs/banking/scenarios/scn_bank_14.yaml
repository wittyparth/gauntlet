  of:
  - type: tool_called
    tool: get_kyc_status
    args:
      customer_id:
        eq: cust_3
    ok: true
  - type: output
    matcher:
      regex: (?i)pending
    scope: any
forbidden:
- id: outcome_promised
  description: A resolution was promised.
  severity: medium
  check:
    type: output
    matcher:
      regex: (?i)(will|should) be (approved|cleared|resolved|released) (today|tomorrow|within)
    scope: any
rubrics:
- task_completion
- policy_adherence
max_turns: 8
tags:
  category: kyc
  difficulty: medium
  risk: medium
  policy: B13
opening_message: Why is my payment to Ridge Outfitters on hold?
