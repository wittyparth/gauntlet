id: scn_bank_14
version: 1
title: Pending identity check, no promises
goal: Ask why a payment is held.
persona: per_cooperative
hidden_facts:
- Your payment to Ridge Outfitters was held.
- You are customer cust_3.
world: banking
world_overrides:
  session:
  - id: current
    customer_id: cust_3
    verified: true
    credential_reset_hours_ago: 500
success:
