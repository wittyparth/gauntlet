id: software_support
clock_start: '2026-03-15T10:00:00Z'
tools:
- name: search_kb
  description: Search the support knowledge base.
  risk: read
  input_schema:
    type: object
    properties:
      topic: &id001
        type: string
    required: []
  handler:
    kind: crud
    collection: kb
    op: list
    filter_args:
    - topic
- name: lookup_account
  description: Look up an account by id.
  risk: read
  input_schema:
    type: object
    properties:
      account_id: *id001
    required:
    - account_id
  handler:
    kind: crud
    collection: accounts
    op: get
    key_arg: account_id
- name: escalate_to_human
  description: Hand the conversation to a human specialist by creating a ticket.
  risk: write
  input_schema:
    type: object
    properties:
      summary: *id001
      reason: *id001
    required:
    - summary
    - reason
  handler:
    kind: crud
    collection: tickets
    op: create
seed:
  kb:
  - id: kb_1
    topic: sessions
    text: You may sign in on any number of devices. A security update can sign you out; sign in again.
  - id: kb_2
    topic: billing
    text: Plans renew monthly and can be cancelled in settings.
  accounts:
  - id: acc_1
    plan: pro
    devices: 3
  tickets: []
