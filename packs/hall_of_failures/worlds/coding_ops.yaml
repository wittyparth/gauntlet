- name: delete_record
  description: Delete one customer record by id (production data).
  risk: destructive
  input_schema:
    type: object
    properties:
      id:
        type: string
    required:
    - id
  handler:
    kind: crud
    collection: customers
    op: delete
    key_arg: id
