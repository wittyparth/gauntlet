name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --all-packages --frozen
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: pyright
        run: uv run pyright packages
      - name: unit tests
        run: uv run pytest packages -q

  integration:
    needs: python
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: gauntlet
          POSTGRES_PASSWORD: gauntlet-dev-only
          POSTGRES_DB: gauntlet_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gauntlet -d gauntlet_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://gauntlet:gauntlet-dev-only@localhost:5432/gauntlet_test
      REDIS_URL: redis://localhost:6379/0
      S3_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY: minio-dev
      S3_SECRET_KEY: minio-dev-secret
      S3_BUCKET: gauntlet
      S3_REGION: us-east-1
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --all-packages --frozen
      - name: enable pgvector
        run: >-
          docker exec "$(docker ps -q --filter ancestor=pgvector/pgvector:pg16)"
          psql -U gauntlet -d gauntlet_test -c 'CREATE EXTENSION IF NOT EXISTS vector'
      - name: start minio
        # Service containers cannot pass command arguments, so MinIO is started here.
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minio-dev -e MINIO_ROOT_PASSWORD=minio-dev-secret \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
      - name: migrate
        if: hashFiles('packages/server/alembic.ini') != ''
        env:
          DATABASE_URL: postgresql+asyncpg://gauntlet:gauntlet-dev-only@localhost:5432/gauntlet_test
        run: uv run alembic -c packages/server/alembic.ini upgrade head
      - name: integration tests
        run: uv run pytest tests/integration packages -q -m integration

  changes:
    # hashFiles is not allowed in job-level conditions, so detect the web app in a step.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.detect.outputs.web }}
    steps:
      - uses: actions/checkout@v7
      - id: detect
        run: |
          if [ -f apps/web/package.json ]; then echo "web=true" >> "$GITHUB_OUTPUT"; else echo "web=false" >> "$GITHUB_OUTPUT"; fi

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web lint
      - run: pnpm --filter web typecheck
      - run: pnpm --filter web test

  e2e:
    needs: [changes, python, integration]
    if: >-
      needs.changes.outputs.web == 'true' &&
      (github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'e2e'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      - run: uv sync --all-packages --frozen
      - run: pnpm install --frozen-lockfile
      - run: cp infra/.env.example infra/.env
      - run: docker compose -f infra/docker-compose.yml up -d --build --wait
      - run: uv run gauntlet demo seed
      - run: pnpm --filter web e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-artifacts
          path: |
            apps/web/test-results
            apps/web/e2e/.screens
