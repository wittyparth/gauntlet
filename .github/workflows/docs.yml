name: docs

# Build only. Deploy is off until the lead enables it (add a Pages deploy job then).
on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", "tools/docs/**", "packages/**"]
  pull_request:
    paths: ["docs/**", "mkdocs.yml", "tools/docs/**", "packages/**"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --all-packages --frozen
      - name: references are current
        run: |
          uv run python -m tools.docs.cli_ref --check
          uv run python -m tools.docs.api_ref --check
          uv run python -m tools.docs.check_ref --check
      - name: quickstart runs
        run: uv run python -m tools.docs.quickstart_check
      - name: build site
        run: uv run mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "1"
